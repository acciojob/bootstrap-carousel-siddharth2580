<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <div id="myCarousel" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
            <div class="item first-slide">
                <div style="background: #777; color: white; height: 400px; text-align: center; line-height: 400px; font-size: 40px;">First slide</div>
            </div>
            <div class="item second-slide">
                <div style="background: #666; color: white; height: 400px; text-align: center; line-height: 400px; font-size: 40px;">Second slide</div>
            </div>
            <div class="item third-slide active">
                <div style="background: #555; color: white; height: 400px; text-align: center; line-height: 400px; font-size: 40px;">Third slide</div>
            </div>
            <div class="item fourth-slide">
                <div style="background: #444; color: white; height: 400px; text-align: center; line-height: 400px; font-size: 40px;">Fourth slide</div>
            </div>
            <div class="item fifth-slide">
                <div style="background: #333; color: white; height: 400px; text-align: center; line-height: 400px; font-size: 40px;">Fifth slide</div>
            </div>
        </div>

        <a class="left carousel-control" href="#myCarousel" data-slide="prev">
            <span class="glyphicon glyphicon-chevron-left"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="right carousel-control" href="#myCarousel" data-slide="next">
            <span class="glyphicon glyphicon-chevron-right"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
